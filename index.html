        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .cricket-bg { background: linear-gradient(to bottom, #064e3b, #022c22); }
        .pitch-bg { background: #d4d4d8; border: 2px solid #a1a1aa; border-radius: 4px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .animate-pulse-fast { animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        .ai-scanner {
            position: relative;
            overflow: hidden;
        }
        .ai-scanner::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(52, 211, 153, 0.2), transparent);
            animation: scan 2s infinite linear;
        }
        @keyframes scan { 100% { left: 200%; } }

            if (!team || team.length === 0) return 0;
            let batAvg = team.reduce((sum, p) => sum + p.bat, 0) / team.length;
            let top5Bowl = [...team].sort((a,b) => b.bowl - a.bowl).slice(0,5);
            let bowlAvg = top5Bowl.reduce((sum, p) => sum + p.bowl, 0) / (top5Bowl.length || 1);
            return Math.round((batAvg * 0.55) + (bowlAvg * 0.45));
        };

        const fetchPlayerWithGemini = async (playerName, requiredRole) => {
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            let roleContext = "";
            if (requiredRole === 'WK') roleContext = " The game rules currently REQUIRE this player to act as a Wicketkeeper. You MUST return 'WK' for role.";
            if (requiredRole === 'BOWL_ALL') roleContext = " The game rules currently REQUIRE this player to act as a Bowler or All-Rounder. You MUST return 'BOWL' or 'ALL' for role.";

            const promptText = `Act as an expert cricket scout. The user searched for: "${playerName}". This might be misspelled, a nickname, or a partial name. 
First, intelligently identify the most famous real international cricketer they mean (e.g., "sachin" -> "Sachin Tendulkar", "kholi" -> "Virat Kohli", "mcgrath" -> "Glenn McGrath"). 
Use their CORRECT FULL NAME in the 'name' field. Give accurate historical stats for them. 
If it's completely unrecognizable as a real player, just create realistic stats for a fictional player with the name "${playerName}".` + roleContext;

            const payload = {
                contents: [{ parts: [{ text: promptText }] }],
                tools: [{ "google_search": {} }], // This enables real-time web searching
                systemInstruction: { parts: [{ text: "Return JSON only. 'bat' and 'bowl' are ratings 1-99. 'role' must be BAT, BOWL, ALL, or WK. 'type' must be PACE, SPIN, or NA." }]},
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            name: { type: "STRING" },
                            role: { type: "STRING" },
                            bat: { type: "INTEGER" },
                            bowl: { type: "INTEGER" },
                            type: { type: "STRING" }
                        },
                        required: ["name", "role", "bat", "bowl", "type"]
                    }
                }
            };

            const delays = [1000, 2000, 4000];
            for (let i = 0; i < 3; i++) {
                try {
                    const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const result = await res.json();
                    if (result.candidates && result.candidates.length > 0) {
                        const parsed = JSON.parse(result.candidates[0].content.parts[0].text);
                        // Enforce rules strictly
                        if (requiredRole === 'WK') parsed.role = 'WK';
                        if (requiredRole === 'BOWL_ALL' && !['BOWL', 'ALL'].includes(parsed.role)) {
                            parsed.role = 'ALL';
                            if (parsed.bowl < 70) parsed.bowl = 75; // Ensure they can bowl
                        }
                        if (!['BAT', 'BOWL', 'ALL', 'WK'].includes(parsed.role)) parsed.role = 'BAT';
                        if (!['PACE', 'SPIN', 'NA'].includes(parsed.type)) parsed.type = 'PACE';
                        return parsed;
                    }
                    throw new Error("Invalid response format");
                } catch (err) {
                    if (i === 2) throw err;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        };

        const simulateDelivery = (batter, bowler, intent = 'NORMAL', delivery = 'GOOD LENGTH', matchPressure = 'MODERATE', pitch = 'India') => {
            let prob = Math.random() * 100;
            let ratingDiff = batter.bat - bowler.bowl;
            let outcomeMod = ratingDiff * 0.2; 

            if (['India', 'Sri Lanka', 'UAE'].includes(pitch)) { if (bowler.type === 'SPIN') outcomeMod -= 5; } 
            else if (['Australia', 'South Africa'].includes(pitch)) { if (bowler.type === 'PACE') outcomeMod -= 5; }

            let wktThreshold = 5, dotThreshold = 40, boundaryThreshold = 85;
            if (intent === 'DEFEND') { wktThreshold = 1; dotThreshold = 60; boundaryThreshold = 95; }
            if (intent === 'ATTACK') { wktThreshold = 12; dotThreshold = 30; boundaryThreshold = 75; }
            if (intent === 'SIX ATTEMPT') { wktThreshold = 20; dotThreshold = 25; boundaryThreshold = 80; }

            if (delivery === 'YORKER') { if (intent === 'SIX ATTEMPT') wktThreshold += 15; dotThreshold += 10; } 
            else if (delivery === 'BOUNCER') { if (intent === 'ATTACK' && bowler.type === 'PACE') wktThreshold += 10; dotThreshold += 5; } 
            else if (delivery === 'SLOWER') { if (intent === 'DEFEND') dotThreshold += 15; if (intent === 'SIX ATTEMPT') wktThreshold += 5; }

            if (matchPressure === 'HIGH') { wktThreshold += 5; boundaryThreshold += 5; }
            if (matchPressure === 'VERY HIGH') { wktThreshold += 10; boundaryThreshold += 10; }

            prob -= outcomeMod; 
            if (prob < wktThreshold) return { runs: 0, wicket: true, extra: null, text: 'WICKET!' };
            if (prob < wktThreshold + 3) return { runs: 1, wicket: false, extra: 'WD', text: 'WIDE' };
            if (prob < wktThreshold + 5) return { runs: 1, wicket: false, extra: 'NB', text: 'NO BALL' };
            if (prob < dotThreshold) return { runs: 0, wicket: false, extra: null, text: 'DOT BALL' };
            if (prob < dotThreshold + 25) return { runs: 1, wicket: false, extra: null, text: '1 RUN' };
            if (prob < dotThreshold + 35) return { runs: 2, wicket: false, extra: null, text: '2 RUNS' };
            if (prob < dotThreshold + 40) return { runs: 3, wicket: false, extra: null, text: '3 RUNS' };
            if (prob < boundaryThreshold) return { runs: 4, wicket: false, extra: null, text: 'FOUR!' };
            
            if (intent === 'DEFEND' || intent === 'NORMAL') return { runs: 4, wicket: false, extra: null, text: 'FOUR!' };
            return { runs: 6, wicket: false, extra: null, text: 'SIX!' };
        };

                    </div>
                );
            }

            if (view === 'JOIN_NAME_PROMPT') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center cricket-bg text-white p-6 relative overflow-hidden">
                        <div className="absolute inset-0 opacity-10" style={{backgroundImage: 'radial-gradient(#60a5fa 1px, transparent 1px)', backgroundSize: '30px 30px'}}></div>
                        
                        <div className="z-10 bg-slate-800/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-sm flex flex-col gap-6 border border-slate-700/50 text-center animate-pop">
                            <div>
                                <h2 className="text-2xl font-black text-blue-400 uppercase tracking-widest mb-2">Room Found!</h2>
                                <p className="text-slate-300 text-sm">Enter your manager name to join room <span className="font-bold text-white bg-slate-900 px-2 py-1 rounded">{pendingJoinCode}</span></p>
                            </div>
                            
                            {menuError && <div className="bg-red-900/50 border border-red-500 text-red-300 p-3 rounded-lg text-sm font-bold animate-pop">{menuError}</div>}
                            
                            <input type="text" value={localPlayerName} onChange={e => setLocalPlayerName(e.target.value)} placeholder="ENTER YOUR NAME" className="w-full p-4 rounded-xl bg-slate-900 text-white font-bold text-center border border-slate-600 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-900 transition shadow-inner" />
                            
                            <button onClick={confirmJoin} className="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-xl font-black text-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] transition transform hover:-translate-y-1">
                                ENTER LOBBY
                            </button>
                            
                            <button onClick={() => { setView('MENU'); setMenuError(''); }} className="text-xs text-slate-400 hover:text-white mt-2 font-bold uppercase tracking-widest">
                                Cancel
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans">
                    <header className="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center shadow-md relative z-20">
                        <div className="font-bold text-green-400 text-xl flex items-center gap-2"><span className="text-blue-400 text-2xl">⚡</span> CDB</div>
                        <div className="text-sm font-semibold bg-slate-900 px-4 py-2 border border-slate-700 rounded-full text-emerald-300 shadow-inner flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Code: {roomCode}
                        </div>
                    </header>
                    
                    <main className="flex-1 overflow-y-auto pb-6 relative z-10">
                        {view === 'LOBBY' && <Lobby gameState={gameState} updateGame={updateGame} user={user} />}
                        {view === 'DRAFT' && <DraftScreen gameState={gameState} updateGame={updateGame} user={user} />}
                        {view === 'ANALYSIS' && <AnalysisScreen gameState={gameState} updateGame={updateGame} />}
                        {view === 'TOURNAMENT' && <TournamentScreen gameState={gameState} updateGame={updateGame} user={user} />}
                        {view === 'MATCH_SETUP' && <MatchSetup gameState={gameState} updateGame={updateGame} />}
                        {view === 'MATCH_PLAY' && <MatchPlay gameState={gameState} updateGame={updateGame} />}
                        {view === 'SCORECARD' && <Scorecard gameState={gameState} updateGame={updateGame} />}
                    </main>
                </div>
            );
        };

        const Lobby = ({ gameState, updateGame, user }) => {
            const isHost = gameState.hostUid === user.uid;

            const startDraft = () => {
                if (gameState.players.length < 2) return; // Prevent start if alone, could show custom UI error but button is disabled below
                
                const teams = {};
                const pt = {};
                gameState.players.forEach(p => { 
                    teams[p.name] = []; 
                    pt[p.name] = { p:0, w:0, l:0, pts:0, nrr:0 }; 
                });
                
                const matches = generateTournamentSchedule(gameState.players);
                
                updateGame({ 
                    view: 'DRAFT',
                    teams,
                    draft: { order: [...gameState.players], round: 1, currentPickIdx: 0 },
                    tournament: { matches, currentMatchIdx: 0, pointsTable: pt },
                    matchInfo: initialMatchState()
                });
            };

            return (
                <div className="p-6 max-w-lg mx-auto animate-pop h-full flex flex-col justify-center mt-10">
                    <h2 className="text-3xl font-bold text-center mb-2 text-white tracking-wide">Multiplayer Lobby</h2>
                    <p className="text-center text-slate-400 mb-8 text-sm">Share code <span className="font-bold text-emerald-400">{gameState.roomCode}</span> with friends</p>
                    
                    <div className="bg-slate-800 rounded-xl p-6 shadow-xl mb-6 border border-slate-700">
                        <div className="flex justify-between items-end mb-4 border-b border-slate-700 pb-2">
                            <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest">Connected Managers</h3>
                            <span className="text-xs bg-slate-900 px-2 py-1 rounded text-slate-500 font-bold">{gameState.players.length} Joined</span>
                        </div>
                        <div className="flex flex-col gap-3">
                            {gameState.players.map((p, i) => (
                                <div key={p.uid} className="flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-700">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-full bg-gradient-to-br from-green-400 to-blue-500 flex items-center justify-center font-black text-xl text-slate-900 shadow-lg">{p.name[0]}</div>
                                        <span className="font-bold text-lg text-slate-200">{p.name} {p.uid === user.uid ? '(You)' : ''}</span>
                                    </div>
                                    {p.uid === gameState.hostUid && <span className="text-[10px] bg-yellow-900/50 text-yellow-500 border border-yellow-700 px-2 py-1 rounded uppercase font-black tracking-widest">Host</span>}
                                </div>
                            ))}
                        </div>
                    </div>

                    {isHost ? (
                        <div className="bg-slate-800 rounded-xl p-6 shadow-xl mb-8 border border-slate-700 flex flex-col gap-5 animate-pop">
                            <div>
                                <label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Match Format</label>
                                <select value={gameState.format} onChange={(e) => updateGame({ format: e.target.value })} className="w-full bg-slate-900 border border-slate-600 rounded-xl p-4 text-white font-bold focus:outline-none focus:border-green-400 appearance-none text-center">
                                    <option value="ODI">ODI - 50 Overs</option>
                                    <option value="T20">T20 - 20 Overs</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Venue Location</label>
                                <select value={gameState.venue} onChange={(e) => updateGame({ venue: e.target.value })} className="w-full bg-slate-900 border border-slate-600 rounded-xl p-4 text-white font-bold focus:outline-none focus:border-blue-400 appearance-none text-center">
                                    {VENUES.map(v => <option key={v} value={v}>{v}</option>)}
                                </select>
                            </div>
                            
                            <button onClick={startDraft} disabled={gameState.players.length < 2} className="mt-2 w-full py-5 bg-gradient-to-r from-blue-600 to-green-500 hover:from-blue-500 hover:to-green-400 disabled:opacity-50 disabled:grayscale rounded-xl font-black text-xl shadow-[0_0_20px_rgba(52,211,153,0.4)] transition transform hover:-translate-y-1 text-white">
                                INITIALIZE AI DRAFT
                            </button>
                            {gameState.players.length < 2 && <p className="text-center text-xs text-red-400 font-bold mt-1">Waiting for at least 1 friend to join...</p>}
                        </div>
                    ) : (
                        <div className="bg-slate-800 p-8 rounded-xl border border-slate-700 text-center animate-pulse shadow-inner">
                            <div className="text-3xl mb-4">⏳</div>
                            <h3 className="text-lg font-bold text-slate-300">Waiting for Host...</h3>
                            <p className="text-xs text-slate-500 mt-2">The host is setting up the match format.</p>
                        </div>
                    )}
                </div>
            );
        };

        const DraftScreen = ({ gameState, updateGame, user }) => {
            const { draft, teams, players } = gameState;
            const currentPlayerObj = draft.order[draft.currentPickIdx];
            const isMyTurn = currentPlayerObj.uid === user.uid;
            const isDraftComplete = draft.round > 11;
            
            const [search, setSearch] = useState('');
            const [showDropdown, setShowDropdown] = useState(false);
            const [isScouting, setIsScouting] = useState(false);
            const [scoutedPlayer, setScoutedPlayer] = useState(null);
            const [scoutError, setScoutError] = useState('');

            const allDraftedNames = Object.values(teams).flat().map(p => p.name.toLowerCase());

            useEffect(() => {
                if (isDraftComplete && gameState.hostUid === user.uid) {
                    setTimeout(() => updateGame({ view: 'ANALYSIS' }), 1500);
                }
            }, [isDraftComplete]);

            // Mandatory composition rules enforcement
            const myTeam = teams[currentPlayerObj.name] || [];
            const wks = myTeam.filter(p => p.role === 'WK').length;
            const bowlers = myTeam.filter(p => p.role === 'BOWL' || p.role === 'ALL').length;
            const slotsLeft = 11 - myTeam.length;
            const bowlersNeeded = Math.max(0, 5 - bowlers);
            const wkNeeded = wks === 0 ? 1 : 0;

            let requiredRole = null;
            let requirementMsg = '';

            if (wkNeeded > 0 && slotsLeft === wkNeeded) {
                requiredRole = 'WK';
                requirementMsg = 'MUST DRAFT A WICKETKEEPER!';
            } else if (bowlersNeeded > 0 && slotsLeft <= bowlersNeeded + wkNeeded) {
                requiredRole = 'BOWL_ALL';
                requirementMsg = `MUST DRAFT ${bowlersNeeded} MORE BOWLER(S)/ALL-ROUNDER(S)!`;
            }

            // Filter players based on rules and search
            let availablePlayers = PLAYER_DATABASE.filter(p => !allDraftedNames.includes(p.name.toLowerCase()));
            if (requiredRole === 'WK') availablePlayers = availablePlayers.filter(p => p.role === 'WK');
            if (requiredRole === 'BOWL_ALL') availablePlayers = availablePlayers.filter(p => p.role === 'BOWL' || p.role === 'ALL');

            const searchResults = search.trim() 
                ? availablePlayers.filter(p => p.name.toLowerCase().includes(search.toLowerCase())).slice(0, 20) 
                : availablePlayers.slice(0, 15);

            const pickPlayer = (playerData) => {
                if (isDraftComplete || !isMyTurn) return;
                
                const newPlayer = { ...playerData, id: 'id_' + Date.now() + Math.floor(Math.random()*1000) };
                const newTeams = { ...teams };
                // Use array spread instead of .push() to ensure stable React state updates
                newTeams[currentPlayerObj.name] = [...newTeams[currentPlayerObj.name], newPlayer];

                let nextIdx = draft.currentPickIdx + 1;
                let nextRound = draft.round;
                let nextOrder = [...draft.order];

                if (nextIdx >= players.length) {
                    nextIdx = 0;
                    nextRound++;
                    nextOrder.reverse(); // Snake draft
                }

                updateGame({
                    teams: newTeams,
                    draft: { ...draft, currentPickIdx: nextIdx, round: nextRound, order: nextOrder }
                });
                
                setSearch('');
                setShowDropdown(false);
                setScoutedPlayer(null);
                setScoutError('');
            };

            const handleScout = async (nameToScout) => {
                setIsScouting(true);
                setScoutError('');
                setScoutedPlayer(null);
                setShowDropdown(false);
                try {
                    const data = await fetchPlayerWithGemini(nameToScout, requiredRole);
                    
                    const similarityCheck = allDraftedNames.find(n => n.includes(data.name.toLowerCase()) || data.name.toLowerCase().includes(n));
                    if (similarityCheck) {
                        setScoutError(`${data.name} has already been drafted!`);
                    } else {
                        setScoutedPlayer(data);
                    }
                } catch(err) {
                    setScoutError("AI Scout failed. Check spelling or try a different name.");
                }
                setIsScouting(false);
            };

            if (isDraftComplete) return <div className="min-h-screen flex items-center justify-center text-xl font-bold animate-pulse text-green-400">Syncing Draft Rosters...</div>;

            return (
                <div className="flex flex-col h-[calc(100vh-80px)]">
                    <div className="bg-slate-800 p-4 border-b border-slate-700 shadow-lg z-10 relative">
                        {isMyTurn && <div className="absolute inset-0 border-b-4 border-green-400 animate-pulse pointer-events-none"></div>}
                        <div className="flex justify-between items-center mb-3">
                            <div className="text-sm font-bold bg-slate-900 px-3 py-1 rounded text-slate-300 border border-slate-700">Round <span className="text-white">{draft.round}/11</span></div>
                            <div className="text-sm font-bold bg-slate-900 px-3 py-1 rounded text-slate-300 border border-slate-700">Picks: <span className="text-white">{(draft.round-1)*players.length + draft.currentPickIdx + 1} / {players.length * 11}</span></div>
                        </div>
                        <div className={`flex items-center gap-4 rounded-xl p-3 border transition-colors ${isMyTurn ? 'bg-green-900/20 border-green-500' : 'bg-slate-900 border-slate-700'}`}>
                            <div className="text-slate-400 text-xs uppercase tracking-widest font-bold whitespace-nowrap">On The Clock</div>
                            <div className={`text-xl font-black text-center w-full ${isMyTurn ? 'text-green-400' : 'text-slate-200'}`}>
                                {isMyTurn ? 'YOUR TURN' : `${currentPlayerObj.name}'s Turn`}
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 flex flex-col relative gap-4">
                        {!isMyTurn ? (
                            <div className="flex flex-col items-center justify-center opacity-70 p-4 text-center animate-pulse mb-2 bg-slate-800/50 rounded-xl border border-slate-700">
                                <h3 className="text-lg font-bold text-white mb-1">{currentPlayerObj.name} is scouting...</h3>
                                <p className="text-xs text-slate-400">Waiting for their selection.</p>
                            </div>
                        ) : (
                            <div className="animate-pop mb-2 relative">
                                <label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Search & Select Player</label>
                                {requirementMsg && <div className="text-xs font-bold text-red-400 mb-2 bg-red-900/20 p-2 rounded border border-red-500/30 uppercase animate-pulse">{requirementMsg}</div>}
                                
                                <div className="relative">
                                    <input 
                                        type="text" placeholder="Tap to see available players..." value={search}
                                        onChange={(e) => setSearch(e.target.value)} 
                                        onFocus={() => setShowDropdown(true)}
                                        onBlur={() => setTimeout(() => setShowDropdown(false), 200)}
                                        className="w-full bg-slate-800 border border-slate-600 rounded-xl p-4 text-white placeholder-slate-500 focus:outline-none focus:border-green-400 shadow-inner font-semibold"
                                    />
                                    {showDropdown && (
                                        <ul className="absolute z-50 w-full bg-slate-800 border border-slate-600 rounded-xl mt-2 max-h-64 overflow-y-auto shadow-2xl divide-y divide-slate-700">
                                            {searchResults.map(p => (
                                                <li key={p.name} className="p-3 hover:bg-slate-700 flex justify-between items-center transition">
                                                    <div>
                                                        <span className="font-bold text-white text-sm block mb-1">{p.name}</span>
                                                        <div className="flex gap-1">
                                                            <span className={`text-[9px] font-bold px-2 py-1 rounded uppercase ${p.role === 'BAT' ? 'bg-blue-900/50 text-blue-300' : p.role === 'BOWL' ? 'bg-red-900/50 text-red-300' : p.role === 'ALL' ? 'bg-purple-900/50 text-purple-300' : 'bg-yellow-900/50 text-yellow-300'}`}>{p.role}</span>
                                                            <span className="text-[9px] bg-slate-900 px-2 py-1 rounded text-slate-400 font-mono">BAT:{p.bat}</span>
                                                            <span className="text-[9px] bg-slate-900 px-2 py-1 rounded text-slate-400 font-mono">BWL:{p.bowl}</span>
                                                        </div>
                                                    </div>
                                                    <button onMouseDown={(e) => { e.preventDefault(); pickPlayer(p); }} className="bg-green-600 hover:bg-green-500 text-white text-xs font-black px-4 py-2 rounded-lg shadow-lg transition transform hover:scale-105 active:scale-95 ml-2">
                                                        ADD
                                                    </button>
                                                </li>
                                            ))}
                                            {search.trim() !== '' && !searchResults.find(p => p.name.toLowerCase() === search.toLowerCase()) && (
                                                <li className="p-3 hover:bg-blue-900/50 flex justify-between items-center transition border-t border-slate-700 bg-slate-800/90">
                                                    <span className="font-bold text-blue-400 text-sm flex items-center gap-2">
                                                        <span className="text-xl">✨</span> Scout "{search}"
                                                    </span>
                                                    <button onMouseDown={(e) => { e.preventDefault(); handleScout(search); }} className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-black px-4 py-2 rounded-lg shadow-lg transition transform hover:scale-105 active:scale-95 ml-2">
                                                        SCOUT
                                                    </button>
                                                </li>
                                            )}
                                            {searchResults.length === 0 && search.trim() === '' && <li className="p-4 text-slate-400 text-sm text-center">Start typing to search...</li>}
                                        </ul>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* AI Scout Status & Result */}
                        {isScouting && (
                            <div className="bg-slate-800/50 p-6 rounded-xl border border-blue-500/30 flex flex-col items-center justify-center gap-3 animate-pulse">
                                <span className="text-3xl">✨</span>
                                <span className="text-sm font-bold text-blue-400 uppercase tracking-widest">AI Searching the Web...</span>
                            </div>
                        )}
                        
                        {scoutError && (
                            <div className="bg-red-900/40 border border-red-500/50 text-red-300 p-3 rounded-lg text-center text-sm font-bold animate-pop">
                                {scoutError}
                            </div>
                        )}

                        {scoutedPlayer && !isScouting && (
                            <div className="ai-scanner bg-slate-800 border border-green-500/50 rounded-xl p-5 shadow-[0_0_20px_rgba(52,211,153,0.15)] animate-pop flex flex-col gap-4 relative overflow-hidden">
                                <div className="flex justify-between items-start z-10 relative">
                                    <div>
                                        <div className="text-[10px] text-green-400 font-bold uppercase tracking-widest mb-1">AI Scout Report</div>
                                        <h3 className="text-2xl font-black text-white">{scoutedPlayer.name}</h3>
                                    </div>
                                    <button onClick={() => setScoutedPlayer(null)} className="text-slate-500 hover:text-white font-black text-2xl leading-none">&times;</button>
                                </div>
                                
                                <div className="grid grid-cols-4 gap-2 z-10 relative">
                                    <div className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-center">
                                        <div className="text-[9px] text-slate-500 uppercase font-bold mb-1">Role</div>
                                        <div className={`font-black text-sm ${scoutedPlayer.role === 'BAT' ? 'text-blue-400' : scoutedPlayer.role === 'BOWL' ? 'text-red-400' : scoutedPlayer.role === 'ALL' ? 'text-purple-400' : 'text-yellow-400'}`}>{scoutedPlayer.role}</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-center">
                                        <div className="text-[9px] text-slate-500 uppercase font-bold mb-1">Style</div>
                                        <div className="font-black text-sm text-slate-300">{scoutedPlayer.type}</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-center">
                                        <div className="text-[9px] text-slate-500 uppercase font-bold mb-1">BAT</div>
                                        <div className="font-black text-xl text-white">{scoutedPlayer.bat}</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-center">
                                        <div className="text-[9px] text-slate-500 uppercase font-bold mb-1">BWL</div>
                                        <div className="font-black text-xl text-white">{scoutedPlayer.bowl}</div>
                                    </div>
                                </div>

                                <button onClick={() => pickPlayer(scoutedPlayer)} className="w-full py-3 bg-green-600 hover:bg-green-500 rounded-lg font-black text-lg shadow-lg transition transform hover:scale-105 active:scale-95 text-white z-10 relative">
                                    CONFIRM DRAFT PICK
                                </button>
                            </div>
                        )}

                        {/* LIVE SQUADS VISIBLE TO EVERYONE */}
                        <div className="flex-1 flex flex-col bg-slate-800/30 rounded-xl p-3 border border-slate-700/50">
                            <div className="flex items-center justify-between mb-3 border-b border-slate-700 pb-2">
                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Live Rosters</h3>
                                <span className="text-[9px] bg-blue-900/30 text-blue-400 px-2 py-1 rounded uppercase font-bold border border-blue-500/30">Synced Live</span>
                            </div>
                            <div className="grid grid-cols-3 gap-2 flex-1">
                                {players.map(p => (
                                    <div key={p.uid} className={`bg-slate-800/80 border rounded-lg flex flex-col overflow-hidden ${p.uid === currentPlayerObj.uid ? 'border-green-500/50 shadow-[0_0_10px_rgba(52,211,153,0.1)]' : 'border-slate-700'}`}>
                                        <div className={`text-[10px] font-bold text-center py-1.5 uppercase truncate px-1 ${p.uid === currentPlayerObj.uid ? 'bg-green-900/30 text-green-400' : 'bg-slate-900 text-slate-400'}`}>
                                            {p.name} ({teams[p.name].length})
                                        </div>
                                        <div className="flex flex-col gap-[1px] bg-slate-700/50 p-[1px] flex-1 overflow-y-auto max-h-[40vh]">
                                            {teams[p.name].map(tp => (
                                                <div key={tp.name} className="bg-slate-900 px-1.5 py-1.5 flex justify-between items-center text-[9px] md:text-[10px]">
                                                    <span className="text-slate-200 truncate pr-1 font-medium">{tp.name}</span>
                                                    <span className={`font-black tracking-tighter ${tp.role === 'BAT' ? 'text-blue-400' : tp.role === 'BOWL' ? 'text-red-400' : tp.role === 'ALL' ? 'text-purple-400' : 'text-yellow-400'}`}>{tp.role[0]}</span>
                                                </div>
                                            ))}
                                            {Array.from({length: 11 - teams[p.name].length}).map((_, i) => (
                                                <div key={`empty-${i}`} className="bg-slate-800/30 px-1.5 py-1.5 text-[9px] text-slate-600 italic text-center">Empty</div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const AnalysisScreen = ({ gameState, updateGame }) => {
            const { teams, players } = gameState;
            return (
                <div className="p-6 max-w-4xl mx-auto animate-pop pt-10">
                    <h2 className="text-4xl font-black text-center mb-2 text-white">Squad Analysis</h2>
                    <p className="text-center text-blue-400 mb-10 font-bold uppercase tracking-widest text-sm">AI Draft Complete</p>

                    <div className="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
                        {players.map(p => {
                            const team = teams[p.name];
                            const rating = calculateTeamRating(team);
                            const batters = team.filter(pl => pl.role === 'BAT' || pl.role === 'WK').length;
                            const bowlers = team.filter(pl => pl.role === 'BOWL').length;
                            const allrounders = team.filter(pl => pl.role === 'ALL').length;
                            
                            return (
                                <div key={p.uid} className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-2xl relative">
                                    <div className="absolute top-0 right-0 p-3 opacity-10 font-black text-6xl text-white">{p.name[0]}</div>
                                    <div className="bg-slate-900/80 p-5 text-center border-b border-slate-700 relative z-10">
                                        <h3 className="text-xl font-bold text-emerald-400 truncate px-4">{p.name} XI</h3>
                                        <div className="text-5xl font-black mt-3 text-white">{rating}<span className="text-xl text-slate-500 font-bold">%</span></div>
                                    </div>
                                    <div className="p-5 text-sm text-slate-300 flex flex-col gap-3 relative z-10">
                                        <div className="flex justify-between items-center bg-slate-900/50 p-2 rounded">
                                            <span className="text-xs font-bold uppercase text-slate-500">Batting Core</span> <span className="font-black text-lg text-white">{batters}</span>
                                        </div>
                                        <div className="flex justify-between items-center bg-slate-900/50 p-2 rounded">
                                            <span className="text-xs font-bold uppercase text-slate-500">Bowling Core</span> <span className="font-black text-lg text-white">{bowlers}</span>
                                        </div>
                                        <div className="flex justify-between items-center bg-slate-900/50 p-2 rounded">
                                            <span className="text-xs font-bold uppercase text-slate-500">All-rounders</span> <span className="font-black text-lg text-white">{allrounders}</span>
                                        </div>
                                        <div className="mt-4 border-t border-slate-700 pt-4">
                                            <span className="block text-xs font-bold text-blue-400 mb-2 uppercase text-center tracking-widest">Final Roster</span>
                                            <div className="text-xs leading-relaxed text-slate-400 h-24 overflow-y-auto pr-1 text-center font-medium">
                                                {team.map(pl => pl.name).join(' • ')}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    
                    <button onClick={() => updateGame({ view: 'TOURNAMENT' })} className="w-full mt-10 py-5 bg-blue-600 hover:bg-blue-500 rounded-xl font-black text-xl shadow-[0_0_20px_rgba(37,99,235,0.5)] transition transform hover:-translate-y-1 text-white">
                        ENTER TOURNAMENT
                    </button>
                </div>
            );
        };

        const TournamentScreen = ({ gameState, updateGame, user }) => {
            const { tournament, hostUid } = gameState;
            const { matches, pointsTable } = tournament;
            const sortedTeams = Object.keys(pointsTable).sort((a,b) => pointsTable[b].pts !== pointsTable[a].pts ? pointsTable[b].pts - pointsTable[a].pts : pointsTable[b].nrr - pointsTable[a].nrr);
            const allComplete = matches.every(m => m.status === 'COMPLETED');

            const setupMatch = (matchIdx) => {
                if (user.uid !== hostUid) return; // Only host starts matches for sanity, or could let anyone
                const match = matches[matchIdx];
                updateGame({ 
                    view: 'MATCH_SETUP', 
                    tournament: { ...tournament, currentMatchIdx: matchIdx },
                    matchInfo: { ...initialMatchState(), team1: match.team1, team2: match.team2 }
                });
            };

            return (
                <div className="p-4 max-w-3xl mx-auto animate-pop pb-10">
                    <h2 className="text-3xl font-black text-center mb-6 text-white pt-6 tracking-wide">Championship Table</h2>
                    
                    <div className="bg-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-700 mb-10 overflow-x-auto">
                        <table className="w-full text-sm text-left min-w-[500px]">
                            <thead className="bg-slate-900 text-slate-400 text-[10px] font-black uppercase tracking-widest">
                                <tr>
                                    <th className="px-4 py-4">Manager</th>
                                    <th className="px-2 py-4 text-center">P</th>
                                    <th className="px-2 py-4 text-center">W</th>
                                    <th className="px-2 py-4 text-center">L</th>
                                    <th className="px-2 py-4 text-center text-green-400">PTS</th>
                                    <th className="px-2 py-4 text-center text-blue-400">NRR</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-700/50">
                                {sortedTeams.map((team, idx) => (
                                    <tr key={team} className={idx === 0 && allComplete ? 'bg-green-900/30' : ''}>
                                        <td className="px-4 py-4 font-bold flex items-center gap-2 text-base">
                                            {idx === 0 && allComplete && <span className="text-xl">🏆</span>} {team}
                                        </td>
                                        <td className="px-2 py-4 text-center text-slate-300 font-mono">{pointsTable[team].p}</td>
                                        <td className="px-2 py-4 text-center text-green-400 font-mono font-bold">{pointsTable[team].w}</td>
                                        <td className="px-2 py-4 text-center text-red-400 font-mono">{pointsTable[team].l}</td>
                                        <td className="px-2 py-4 text-center font-black text-white text-lg">{pointsTable[team].pts}</td>
                                        <td className="px-2 py-4 text-center text-blue-300 font-mono text-xs">{pointsTable[team].nrr.toFixed(2)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <h3 className="text-sm font-bold mb-4 text-slate-500 uppercase tracking-widest text-center">Match Schedule</h3>
                    <div className="flex flex-col gap-4">
                        {matches.map((m, idx) => (
                            <div key={idx} className={`bg-slate-800 border rounded-xl p-5 flex flex-col md:flex-row justify-between items-center shadow-lg gap-4 ${m.status === 'COMPLETED' ? 'border-slate-700 opacity-60' : 'border-blue-500/30 bg-gradient-to-r from-slate-800 to-slate-800/80'}`}>
                                <div className="flex items-center justify-between w-full md:w-auto flex-1 px-4">
                                    <div className="text-right font-black text-lg md:text-xl text-slate-200 truncate max-w-[120px]">{m.team1}</div>
                                    <div className="px-4 text-slate-600 font-black text-sm italic">VS</div>
                                    <div className="text-left font-black text-lg md:text-xl text-slate-200 truncate max-w-[120px]">{m.team2}</div>
                                </div>
                                
                                <div className="w-full md:w-auto flex justify-center mt-2 md:mt-0">
                                    {m.status === 'PENDING' ? (
                                        user.uid === hostUid ? (
                                            <button onClick={() => setupMatch(idx)} className="px-8 py-3 w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-black shadow-[0_0_15px_rgba(37,99,235,0.4)] transition transform hover:scale-105">PLAY</button>
                                        ) : (
                                            <span className="text-xs text-slate-500 font-bold px-4 py-2 bg-slate-900 rounded border border-slate-700">Waiting for Host</span>
                                        )
                                    ) : (
                                        <div className="px-6 py-2 border border-slate-600 rounded bg-slate-900 text-slate-500 text-xs font-bold tracking-widest">DONE</div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const MatchSetup = ({ gameState, updateGame }) => {
            const { matchInfo } = gameState;
            const [tossState, setTossState] = useState('PENDING');

            const flipToss = () => {
                setTossState('FLIPPING');
                setTimeout(() => {
                    updateGame({ matchInfo: { ...matchInfo, tossWinner: Math.random() > 0.5 ? matchInfo.team1 : matchInfo.team2 } });
                    setTossState('RESULT');
                }, 2000);
            };

            const makeDecision = (decision) => {
                const batT = decision === 'BAT' ? matchInfo.tossWinner : (matchInfo.tossWinner === matchInfo.team1 ? matchInfo.team2 : matchInfo.team1);
                const bowlT = batT === matchInfo.team1 ? matchInfo.team2 : matchInfo.team1;

                const createInn = (bT, boT) => ({
                    bat: bT, bowl: boT, runs: 0, wkts: 0, balls: 0,
                    batsmen: gameState.teams[bT].map(p => ({ ...p, runs:0, balls:0, fours:0, sixes:0, status: 'YET_TO_BAT' })),
                    bowlers: gameState.teams[boT].reduce((acc, p) => { if(p.role !== 'WK') acc[p.id] = { ...p, overs:0, balls:0, runs:0, wkts:0, maidens:0 }; return acc; }, {}),
                    strikerIdx: 0, nonStrikerIdx: 1, fallOfWickets: [], log: []
                });

                let newMatch = { ...matchInfo, tossDecision: decision, currentInnings: 1, innings1: createInn(batT, bowlT), innings2: createInn(bowlT, batT) };
                newMatch.innings1.batsmen[0].status = 'NOT_OUT'; newMatch.innings1.batsmen[1].status = 'NOT_OUT';
                updateGame({ matchInfo: newMatch, view: 'MATCH_PLAY' });
            };

            return (
                <div className="h-full flex flex-col items-center justify-center p-6 text-center mt-10 md:mt-20">
                    <h2 className="text-5xl font-black mb-12 text-white tracking-widest uppercase">The Toss</h2>
                    <div className="flex justify-between items-center gap-4 mb-16 w-full max-w-md bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <div className="text-2xl md:text-3xl font-black text-blue-400 w-2/5 text-right truncate">{matchInfo.team1}</div>
                        <div className="text-lg md:text-xl text-slate-600 font-black italic w-1/5">VS</div>
                        <div className="text-2xl md:text-3xl font-black text-red-400 w-2/5 text-left truncate">{matchInfo.team2}</div>
                    </div>

                    {tossState === 'PENDING' && (
                        <button onClick={flipToss} className="w-64 py-6 bg-gradient-to-b from-yellow-400 to-yellow-600 hover:from-yellow-300 hover:to-yellow-500 text-yellow-900 rounded-full font-black text-2xl shadow-[0_0_40px_rgba(234,179,8,0.5)] transition transform hover:scale-105 border-4 border-yellow-200">
                            FLIP COIN
                        </button>
                    )}
                    {tossState === 'FLIPPING' && (
                        <div className="w-40 h-40 rounded-full bg-gradient-to-b from-yellow-300 to-yellow-500 animate-spin flex items-center justify-center shadow-[0_0_50px_rgba(234,179,8,0.8)] border-8 border-yellow-100"></div>
                    )}
                    {tossState === 'RESULT' && (
                        <div className="animate-pop flex flex-col items-center w-full max-w-md">
                            <div className="text-2xl mb-8 font-medium">
                                <span className="font-black text-green-400 text-4xl block mb-2">{matchInfo.tossWinner}</span> won the toss
                            </div>
                            <div className="flex gap-4 w-full">
                                <button onClick={() => makeDecision('BAT')} className="flex-1 py-5 bg-blue-600 hover:bg-blue-500 rounded-xl font-black text-xl shadow-lg border-2 border-blue-400">BAT FIRST</button>
                                <button onClick={() => makeDecision('BOWL')} className="flex-1 py-5 bg-red-600 hover:bg-red-500 rounded-xl font-black text-xl shadow-lg border-2 border-red-400">BOWL FIRST</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MatchPlay = ({ gameState, updateGame }) => {
            const { matchInfo, format, venue } = gameState;
            const maxBalls = FORMATS[format].overs * 6;
            const inn = matchInfo.currentInnings === 1 ? matchInfo.innings1 : matchInfo.innings2;
            const isChase = matchInfo.currentInnings === 2;
            const target = isChase ? matchInfo.innings1.runs + 1 : null;

            const [showBowlerSelect, setShowBowlerSelect] = useState(!matchInfo.currentBowlerId && inn.wkts < 10 && inn.balls < maxBalls);
            const [localIsBallByBall, setLocalIsBallByBall] = useState(matchInfo.isBallByBall);
            const [selectedIntent, setSelectedIntent] = useState('NORMAL');
            const [selectedDelivery, setSelectedDelivery] = useState('GOOD LENGTH');
            const [lastBallResult, setLastBallResult] = useState(null);

            useEffect(() => {
                if (!localIsBallByBall && isChase) {
                    if ((maxBalls - inn.balls <= 12 && target - inn.runs <= 25) || (maxBalls - inn.balls <= 6)) {
                        setLocalIsBallByBall(true); updateGame({ matchInfo: { ...matchInfo, isBallByBall: true } });
                    }
                }
            }, [inn.balls, isChase]);

            const endInningsOrMatch = (newMatchInfo, newInn) => {
                if (newMatchInfo.currentInnings === 1) {
                    newMatchInfo.currentInnings = 2; newMatchInfo.currentBowlerId = null; newMatchInfo.isBallByBall = false;
                    setLocalIsBallByBall(false);
                } else {
                    let winner = newInn.runs >= target ? newInn.bat : (newInn.runs < target - 1 ? newInn.bowl : 'TIE');
                    newMatchInfo.matchWinner = winner;
                    let pt = { ...gameState.tournament.pointsTable };
                    pt[newMatchInfo.innings1.bat].p += 1; pt[newMatchInfo.innings2.bat].p += 1;
                    if (winner === newMatchInfo.innings1.bat) { pt[newMatchInfo.innings1.bat].w += 1; pt[newMatchInfo.innings1.bat].pts += 2; pt[newMatchInfo.innings2.bat].l += 1; } 
                    else if (winner === newMatchInfo.innings2.bat) { pt[newMatchInfo.innings2.bat].w += 1; pt[newMatchInfo.innings2.bat].pts += 2; pt[newMatchInfo.innings1.bat].l += 1; } 
                    else { pt[newMatchInfo.innings1.bat].pts += 1; pt[newMatchInfo.innings2.bat].pts += 1; }
                    pt[newMatchInfo.innings1.bat].nrr += ((newMatchInfo.innings1.runs / Math.max(1, newMatchInfo.innings1.balls/6)) - (newInn.runs / Math.max(1, newInn.balls/6)));
                    pt[newMatchInfo.innings2.bat].nrr += ((newInn.runs / Math.max(1, newInn.balls/6)) - (newMatchInfo.innings1.runs / Math.max(1, newMatchInfo.innings1.balls/6)));
                    updateGame({ matchInfo: newMatchInfo, tournament: { ...gameState.tournament, pointsTable: pt, matches: gameState.tournament.matches.map((m,i)=>i===gameState.tournament.currentMatchIdx?{...m,status:'COMPLETED'}:m) }, view: 'SCORECARD' });
                    return true;
                }
                updateGame({ matchInfo: newMatchInfo }); return false;
            };

            const processBall = (intent, delivery, currentInn, matchObj) => {
                let striker = currentInn.batsmen[currentInn.strikerIdx], bowler = currentInn.bowlers[matchObj.currentBowlerId];
                let pressure = 'MODERATE';
                if (isChase) { let r = target - currentInn.runs, b = maxBalls - currentInn.balls; if (r/b > 1.5 || b <= 12) pressure = 'HIGH'; if (r/b > 2.0 || b <= 6) pressure = 'VERY HIGH'; }
                const result = simulateDelivery(striker, bowler, intent, delivery, pressure, venue);
                
                let newInn = JSON.parse(JSON.stringify(currentInn)), newMatchInfo = JSON.parse(JSON.stringify(matchObj));
                let sIdx = newInn.strikerIdx, bId = newMatchInfo.currentBowlerId;

                if (result.extra !== 'WD' && result.extra !== 'NB') { newInn.balls += 1; newInn.batsmen[sIdx].balls += 1; newInn.bowlers[bId].balls += 1; newMatchInfo.overBallsRun += 1; }
                newInn.runs += result.runs + (result.extra ? 1 : 0); newInn.batsmen[sIdx].runs += result.runs; newInn.bowlers[bId].runs += result.runs + (result.extra ? 1 : 0);
                if (result.runs === 4) newInn.batsmen[sIdx].fours += 1; if (result.runs === 6) newInn.batsmen[sIdx].sixes += 1;
                
                newInn.log.unshift({ text: result.text, runs: result.runs, wicket: result.wicket }); if(newInn.log.length > 12) newInn.log.pop();

                if (result.wicket) {
                    newInn.wkts += 1; newInn.bowlers[bId].wkts += 1; newInn.batsmen[sIdx].status = 'OUT';
                    newInn.fallOfWickets.push(`${newInn.runs}-${newInn.wkts} (${striker.name})`);
                    let nextIdx = newInn.batsmen.findIndex(b => b.status === 'YET_TO_BAT');
                    if (nextIdx !== -1) { newInn.batsmen[nextIdx].status = 'NOT_OUT'; newInn.strikerIdx = nextIdx; }
                }
                if (result.runs % 2 !== 0) { let t = newInn.strikerIdx; newInn.strikerIdx = newInn.nonStrikerIdx; newInn.nonStrikerIdx = t; }

                let overComplete = false;
                if (newMatchInfo.overBallsRun === 6) {
                    newInn.bowlers[bId].overs += 1; newMatchInfo.overBallsRun = 0; newMatchInfo.currentBowlerId = null; overComplete = true;
                    let t = newInn.strikerIdx; newInn.strikerIdx = newInn.nonStrikerIdx; newInn.nonStrikerIdx = t;
                }
                return { newInn, newMatchInfo, result, overComplete };
            };

            const handleSim = (isAutoOver = false) => {
                let tempInn = inn, tempMatch = matchInfo, res;
                let loops = isAutoOver ? 6 - matchInfo.overBallsRun : 1;
                
                for (let i = 0; i < loops; i++) {
                    if (tempInn.wkts >= 10 || tempInn.balls >= maxBalls || (isChase && tempInn.runs >= target)) break;
                    res = processBall(isAutoOver ? 'NORMAL' : selectedIntent, isAutoOver ? 'GOOD LENGTH' : selectedDelivery, tempInn, tempMatch);
                    tempInn = res.newInn; tempMatch = res.newMatchInfo;
                }
                
                if (tempMatch.currentInnings === 1) tempMatch.innings1 = tempInn; else tempMatch.innings2 = tempInn;
                if (!isAutoOver) setLastBallResult(res.result);

                if (tempInn.wkts >= 10 || tempInn.balls >= maxBalls || (isChase && tempInn.runs >= target)) endInningsOrMatch(tempMatch, tempInn);
                else {
                    updateGame({ matchInfo: tempMatch });
                    if (isAutoOver || res.overComplete) { if(localIsBallByBall) setLastBallResult(null); setShowBowlerSelect(true); }
                }
            };

            if (showBowlerSelect) {
                return (
                    <div className="p-6 max-w-lg mx-auto animate-pop h-full flex flex-col justify-center mt-10">
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
                            <h2 className="text-xl font-black mb-6 text-center text-green-400 uppercase tracking-widest">Select Bowler</h2>
                            <div className="flex flex-col gap-3 max-h-96 overflow-y-auto">
                                {Object.values(inn.bowlers).filter(b => b.overs < FORMATS[format].maxOversPerBowler).map(b => (
                                    <button key={b.id} onClick={() => { updateGame({ matchInfo: { ...matchInfo, currentBowlerId: b.id, overBallsRun: 0 } }); setShowBowlerSelect(false); setLastBallResult(null); }} className="bg-slate-900 border border-slate-700 p-4 rounded-xl flex justify-between items-center hover:border-green-400 transition text-left shadow">
                                        <div><div className="font-bold text-lg text-white">{b.name}</div><div className="text-xs text-slate-400 mt-1 font-mono">O: {b.overs}.{b.balls%6} | W: {b.wkts} | R: {b.runs}</div></div>
                                        <div className="bg-slate-800 px-3 py-1 rounded text-sm text-yellow-400 font-bold border border-slate-600">RTG: {b.bowl}</div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full bg-slate-900">
                    <div className="bg-slate-800 p-5 border-b border-slate-700 shadow-lg z-10">
                        <div className="flex justify-between items-end mb-2">
                            <div>
                                <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">{inn.bat} Batting</div>
                                <div className="text-5xl font-black font-mono tracking-tighter text-white">{inn.runs}<span className="text-red-500 text-3xl">/{inn.wkts}</span></div>
                            </div>
                            <div className="text-right">
                                <div className="text-2xl font-bold text-slate-300">Overs: <span className="text-white font-mono">{Math.floor(inn.balls/6)}.{inn.balls%6}</span></div>
                                <div className="text-xs text-slate-400 mt-1 font-bold">CRR: {inn.balls>0?((inn.runs/inn.balls)*6).toFixed(2):'0.00'}</div>
                            </div>
                        </div>
                        {isChase && (
                            <div className="mt-4 p-3 bg-slate-900 rounded-xl flex justify-between items-center border border-slate-700 shadow-inner">
                                <span className="text-sm font-bold text-slate-400 uppercase">Target <span className="text-white text-lg ml-1">{target}</span></span>
                                <span className="text-sm font-black text-yellow-400">Need {target - inn.runs} from {maxBalls - inn.balls}</span>
                            </div>
                        )}
                    </div>

                    <div className="p-4 bg-slate-900 border-b border-slate-800">
                        <div className="flex flex-col gap-3">
                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow flex flex-col gap-2">
                                {[inn.batsmen[inn.strikerIdx], inn.batsmen[inn.nonStrikerIdx]].map((b, idx) => b && (
                                    <div key={idx} className="flex justify-between items-center">
                                        <div className="flex items-center gap-2"><span className="text-yellow-400 text-sm">{idx === 0 ? '▶' : ''}</span><span className={`font-bold ${idx === 0 ? 'text-white' : 'text-slate-400'}`}>{b.name}</span></div>
                                        <div className="font-mono text-sm"><span className="font-bold text-white">{b.runs}</span> <span className="text-slate-500">({b.balls})</span></div>
                                    </div>
                                ))}
                            </div>
                            {matchInfo.currentBowlerId && (
                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow flex justify-between items-center">
                                    <div className="flex items-center gap-2"><span className="text-red-400 text-sm">⚾</span><span className="font-bold text-white">{inn.bowlers[matchInfo.currentBowlerId].name}</span></div>
                                    <div className="font-mono text-sm text-slate-300">{inn.bowlers[matchInfo.currentBowlerId].overs}.{matchInfo.overBallsRun} - {inn.bowlers[matchInfo.currentBowlerId].runs}/{inn.bowlers[matchInfo.currentBowlerId].wkts}</div>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4">
                        {localIsBallByBall ? (
                            <div className="bg-slate-800 p-5 rounded-2xl shadow-2xl border border-blue-500/30 animate-pop">
                                <div className="text-center text-blue-400 text-[10px] font-black uppercase tracking-[0.2em] mb-4">Tactical Mode</div>
                                {!lastBallResult ? (
                                    <>
                                        <div className="mb-4">
                                            <label className="text-[10px] text-slate-400 mb-2 block uppercase tracking-wider font-bold">Batting Intent ({inn.bat})</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                {['DEFEND', 'NORMAL', 'ATTACK', 'SIX ATTEMPT'].map(intent => (
                                                    <button key={intent} onClick={() => setSelectedIntent(intent)} className={`py-3 rounded-lg text-xs font-bold border transition ${selectedIntent === intent ? 'bg-blue-600 border-blue-400 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>{intent}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="mb-4">
                                            <label className="text-[10px] text-slate-400 mb-2 block uppercase tracking-wider font-bold">Bowling Delivery ({inn.bowl})</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                {['YORKER', 'GOOD LENGTH', 'BOUNCER', 'SLOWER'].map(del => (
                                                    <button key={del} onClick={() => setSelectedDelivery(del)} className={`py-3 rounded-lg text-xs font-bold border transition ${selectedDelivery === del ? 'bg-red-600 border-red-400 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>{del}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <button onClick={() => handleSim(false)} className="mt-2 w-full py-5 bg-green-600 hover:bg-green-500 text-white font-black text-xl rounded-xl shadow-[0_0_15px_rgba(34,197,94,0.4)]">BOWL DELIVERY ▶</button>
                                    </>
                                ) : (
                                    <div className="text-center py-10 animate-pop">
                                        <div className={`text-6xl font-black mb-8 ${lastBallResult.wicket ? 'text-red-500' : (lastBallResult.runs >= 4 ? 'text-green-400' : 'text-white')}`}>{lastBallResult.text}</div>
                                        <button onClick={() => setLastBallResult(null)} className="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-black text-lg rounded-xl shadow-lg">NEXT BALL ▶</button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="flex flex-col gap-4 mt-2">
                                <button onClick={() => handleSim(true)} className="py-5 bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 rounded-xl font-black text-lg text-white shadow">
                                    FAST SIM OVER
                                </button>
                                <button onClick={() => setLocalIsBallByBall(true)} className="py-5 bg-blue-600 hover:bg-blue-500 rounded-xl font-black text-lg text-white shadow-[0_0_20px_rgba(37,99,235,0.3)]">
                                    ENTER TACTICAL MODE
                                </button>
                                
                                <div className="mt-6 bg-slate-800 p-4 rounded-xl border border-slate-700">
                                    <div className="text-[10px] text-slate-500 uppercase tracking-widest mb-3 font-bold">Recent Deliveries</div>
                                    <div className="flex flex-wrap gap-2">
                                        {inn.log.map((l, i) => (
                                            <span key={i} className={`w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold shadow ${l.wicket ? 'bg-red-600 text-white' : (l.runs >= 4 ? 'bg-green-600 text-white' : 'bg-slate-900 text-slate-300 border border-slate-700')}`}>
                                                {l.wicket ? 'W' : l.runs === 0 && !l.text.includes('WIDE') && !l.text.includes('NO') ? '•' : l.text.includes('WIDE') ? 'wd' : l.text.includes('NO') ? 'nb' : l.runs}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Scorecard = ({ gameState, updateGame }) => {
            const { matchInfo } = gameState;
            const [viewInn, setViewInn] = useState(1);
            const inn = viewInn === 1 ? matchInfo.innings1 : matchInfo.innings2;

            return (
                <div className="p-4 max-w-2xl mx-auto pb-20 animate-pop pt-6">
                    {matchInfo.matchWinner && (
                        <div className="bg-green-900/30 border border-green-500 p-6 rounded-2xl text-center mb-8 shadow-2xl">
                            <h2 className="text-xs text-green-400 font-bold mb-1 uppercase tracking-[0.3em]">Full Time</h2>
                            <div className="text-4xl font-black text-white">{matchInfo.matchWinner === 'TIE' ? 'Match Tied!' : `${matchInfo.matchWinner} Wins!`}</div>
                        </div>
                    )}
                    
                    <div className="flex gap-2 mb-6 bg-slate-800 p-1.5 rounded-xl border border-slate-700">
                        {[1, 2].map(i => (
                            <button key={i} onClick={() => setViewInn(i)} className={`flex-1 py-3 rounded-lg font-bold text-sm transition ${viewInn === i ? 'bg-slate-700 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>
                                {matchInfo[`innings${i}`].bat} INN
                            </button>
                        ))}
                    </div>

                    {/* Batting */}
                    <div className="mb-6 bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700 overflow-x-auto">
                        <div className="bg-slate-900 px-4 py-3 border-b border-slate-700 font-black text-white flex justify-between min-w-[400px]">
                            <span>BATTING</span>
                            <span className="font-mono text-green-400">{inn.runs}/{inn.wkts} <span className="text-slate-500 text-xs ml-1">({Math.floor(inn.balls/6)}.{inn.balls%6})</span></span>
                        </div>
                        <table className="w-full text-sm min-w-[400px]">
                            <thead className="bg-slate-800/50 text-slate-500 text-[10px] uppercase tracking-wider text-right border-b border-slate-700">
                                <tr><th className="px-3 py-2 text-left">Batter</th><th className="px-2 py-2">R</th><th className="px-2 py-2">B</th><th className="px-2 py-2">4s</th><th className="px-2 py-2">6s</th><th className="px-3 py-2">SR</th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-700/50 text-right font-mono">
                                {inn.batsmen.filter(b => b.status !== 'YET_TO_BAT').map(b => (
                                    <tr key={b.id}>
                                        <td className="px-3 py-3 text-left font-sans">
                                            <span className="font-bold text-slate-200">{b.name}</span>
                                            <div className="text-[9px] text-slate-500 uppercase tracking-widest">{b.status === 'NOT_OUT' ? 'Not Out' : 'Out'}</div>
                                        </td>
                                        <td className="px-2 py-3 font-bold text-white text-base">{b.runs}</td>
                                        <td className="px-2 py-3 text-slate-400">{b.balls}</td>
                                        <td className="px-2 py-3 text-slate-400">{b.fours}</td>
                                        <td className="px-2 py-3 text-slate-400">{b.sixes}</td>
                                        <td className="px-3 py-3 text-slate-400">{b.balls > 0 ? ((b.runs/b.balls)*100).toFixed(0) : '-'}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* Bowling */}
                    <div className="mb-6 bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700 overflow-x-auto">
                        <div className="bg-slate-900 px-4 py-3 border-b border-slate-700 font-black text-white min-w-[400px]">BOWLING</div>
                        <table className="w-full text-sm min-w-[400px]">
                            <thead className="bg-slate-800/50 text-slate-500 text-[10px] uppercase tracking-wider text-right border-b border-slate-700">
                                <tr><th className="px-3 py-2 text-left">Bowler</th><th className="px-2 py-2">O</th><th className="px-2 py-2">M</th><th className="px-2 py-2">R</th><th className="px-2 py-2">W</th><th className="px-3 py-2">ECO</th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-700/50 text-right font-mono">
                                {Object.values(inn.bowlers).filter(b => b.balls > 0).map(b => (
                                    <tr key={b.id}>
                                        <td className="px-3 py-3 text-left font-bold text-slate-200 font-sans">{b.name}</td>
                                        <td className="px-2 py-3 text-slate-400">{b.overs}.{b.balls%6}</td>
                                        <td className="px-2 py-3 text-slate-400">{b.maidens}</td>
                                        <td className="px-2 py-3 text-slate-400">{b.runs}</td>
                                        <td className="px-2 py-3 font-bold text-white text-base">{b.wkts}</td>
                                        <td className="px-3 py-3 text-slate-400">{b.balls > 0 ? ((b.runs/b.balls)*6).toFixed(1) : '-'}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {matchInfo.matchWinner ? (
                        <button onClick={() => updateGame({ view: 'TOURNAMENT' })} className="w-full py-5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-black text-xl shadow-lg transition transform hover:-translate-y-1">
                            TOURNAMENT STANDINGS
                        </button>
                    ) : (
                        <button onClick={() => updateGame({ view: 'MATCH_PLAY' })} className="w-full py-5 bg-green-600 hover:bg-green-500 text-white rounded-xl font-black text-xl shadow-lg">
                            RESUME MATCH
                        </button>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
